name: Build and Release my_scrobbler

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Compile for macOS
        run: |
          # Compile for Apple Silicon
          GOOS=darwin GOARCH=arm64 go build -o build/my-scrobbler-darwin ./cmd/scrobbler

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/my-scrobbler-darwin
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
